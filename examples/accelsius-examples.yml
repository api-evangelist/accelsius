- name: firewall-block
  operation: errors/accelsius-problem-types.yml
  request:
    method: GET
    url: https://accelsius.com/wp-json/wp/v2/settings
    headers: {}
  response:
    status: 403
    headers:
      content-type: text/html
    body: '<div style=''height: 98vh;''><div style=''text-align: center; ...''><div><p>MalCare WordPress
      Security Plugin - Malware Scanner, Cleaner, Security Firewall Firewall</p></div><p>Blocked because
      of Malicious Activities</p><p>Reference ID: REDACTED</p></div></div>'
  note: Not a WordPress error. Once the MalCare firewall on this origin classifies a client as hostile
    it substitutes this HTML page for the JSON envelope on every route, including ones that would otherwise
    return 200. A consumer must branch on content-type. The Reference ID is per-block and has been redacted
    here.
