summary:
  types:
  - none
  - http
  - cookie
  api_key_in: []
  oauth2_flows: []
  notes: >-
    Accelsius publishes no developer program and no product API. Its only machine-readable
    surface is the platform-provided WordPress REST API at accelsius.com/wp-json/, and the read
    half of that surface is fully public: every operation documented in this repo's openapi/
    specs was verified to return HTTP 200 with JSON to an anonymous request carrying no
    credentials of any kind. There is no API key, no OAuth, no OpenID Connect, no signup and no
    developer credential to obtain — /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server both returned 404. Unlike a stock install, this root
    index does advertise one scheme: `authentication.application-passwords`, whose authorization
    endpoint is https://accelsius.com/wp-admin/authorize-application.php. That is an
    administrative WordPress credential for site editors, not a public developer credential, and
    it exists to serve the write half of the same routes. Those write operations are deliberately
    NOT documented in this repo's openapi/ specs, which describe only the anonymously reachable
    read surface.
schemes:
- name: public-read
  type: none
  description: >-
    Anonymous public read access to the WordPress content API — resource-library posts, the news
    custom post type, pages, media, categories, tags, HappyFiles media folders, site search, and
    the type/taxonomy/status registries.
  evidence: >-
    GET /wp-json/wp/v2/posts?per_page=1 returned HTTP 200 with post JSON, `X-WP-Total: 154` and
    `Allow: GET`; the same anonymous request pattern returned 200 on news (8), pages (30),
    media (903), categories (8), tags (5), happyfiles_category (19), search (192), navigation,
    types, taxonomies and statuses.
- name: applicationPassword
  type: http
  scheme: basic
  description: >-
    WordPress Application Passwords over HTTP Basic — the one credential the site itself
    advertises. It governs the write half of these routes and the administrative read routes. It
    belongs to a logged-in Accelsius site editor; there is no public issuance path.
  in: header
  evidence: >-
    The root index at https://accelsius.com/wp-json/ returns an `authentication` object whose
    `application-passwords.endpoints.authorization` value is
    https://accelsius.com/wp-admin/authorize-application.php.
  sources:
