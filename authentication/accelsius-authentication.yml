  detail: >-
    Unlike most of the administrative surface, the WordPress user directory on this host answers
    anonymously with HTTP 200 and 14 records. These are the site's content-author accounts — the
    standard WordPress `view` context returns display name, slug, description, avatar URLs and
    author-archive link, and no email address or password material. It is nonetheless a directory
    of named individuals.
