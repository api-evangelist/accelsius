support:
  url: https://accelsius.com/customer-support/
  contact: https://accelsius.com/contact/
  faq: https://accelsius.com/faq/
  email: info@accelsius.com
  detail: >-
    Customer support for cooling hardware, a general contact form and an FAQ. There is no
    developer support channel, forum, developer-relations contact or GitHub organization — a
    search for an Accelsius GitHub org returned nothing.
stability:
  assessment: unmanaged
  detail: >-
    This is an incidental API surface. It is public and stable in shape because WordPress core
    is, but Accelsius makes no commitment about it, monitors no consumers, and has no mechanism
    to warn them of a breaking change. It is additionally guarded by a behavioural firewall that
    will cut a caller off without warning or a documented threshold. Consumers should pin to
    nothing, cache within the observed 600-second Cache-Control window, request one collection
    page at a time with `_fields` set, self-throttle to the 10-second robots.txt crawl delay, and
    tolerate the surface disappearing entirely.
