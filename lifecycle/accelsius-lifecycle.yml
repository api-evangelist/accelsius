summary: >-
  Accelsius operates no API program, so it publishes no API versioning policy, no deprecation
  policy, no SLA, no status page and no changelog. What versioning exists is inherited from the
  WordPress platform and its plugins. Absence is recorded here as observed fact — no StatusPage
  and no Deprecation pointer is wired for this provider, because neither page exists.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  namespaces:
  - namespace: wp/v2
    surface: WordPress core content API (posts, news, pages, media, taxonomy, registry, search)
  - namespace: oembed/1.0
    surface: oEmbed provider endpoint
  - namespace: yoast/v1
    surface: Yoast SEO endpoints (public routes require parameters; most are credential-gated)
  - namespace: ws-form/v1
    surface: WS Form plugin configuration and stylesheet routes
  - namespace: wpforms/v1
    surface: WPForms plugin routes (credential-gated)
  - namespace: bricks/v1
    surface: Bricks page-builder template routes
  - namespace: redirection/v1
    surface: Redirection plugin routes (credential-gated)
  - namespace: leadin/v1
    surface: HubSpot (LeadIn) plugin routes (credential-gated)
  - namespace: cleantalk-antispam/v1
    surface: CleanTalk anti-spam plugin routes
  - namespace: wpe/cache-plugin/v1
    surface: WP Engine cache plugin routes
  - namespace: wpe_sign_on_plugin/v1
    surface: WP Engine single sign-on routes
  - namespace: wp-abilities/v1
    surface: WordPress abilities registry (credential-gated)
  owner: platform
  detail: >-
    The version segment is set by WordPress core and by each plugin, not by Accelsius. A
    WordPress core upgrade, a plugin update, or the removal of the HappyFiles or Advanced Custom
    Fields plugins can change or delete parts of this surface without any notice to callers.
    That is the principal consumption risk here — the `acf` object on every content item and the
    entire happyfiles_category taxonomy are plugin-provided, not core.
