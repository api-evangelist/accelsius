  name: Accelsius Resources Content API
  description: 'The public WordPress REST collection behind https://accelsius.com/resources/ - the Accelsius
    resource library, holding 154 published items at time of capture across eight content classes carried
    as categories: blog (39), press-release (34), news-article (26), white-paper (24), video (13), infographic
    (9), podcast (8) and case-study (1), crossed with five topic tags. Anonymous and read-only; verified
    live returning HTTP 200 with Allow: GET and X-WP-Total: 154. Not a product API - Accelsius sells liquid-cooling
    hardware and publishes no developer program. The OpenAPI is derived by API Evangelist from the site
