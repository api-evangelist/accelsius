  name: Accelsius API Discovery
  description: The WordPress REST route-discovery documents served at accelsius.com/wp-json/ and accelsius.com/wp-json/wp/v2
    - the only machine-readable API description documents Accelsius serves. They enumerate 387 routes
    across 16 namespaces with per-route HTTP methods and full argument schemas, and they are the source
    every OpenAPI document in this profile was derived from. The root index also advertises the site name,
    home URL, timezone offset and the application-passwords authorization endpoint. Pass _fields - the
