  name: Accelsius Taxonomy API
  description: 'The classification layer behind the Accelsius content API: the eight category terms that
    separate content classes, the five post_tag topic terms (2pd2c-education, neucool-products, accelsius-news,
    scientific-research, featured), the 19 HappyFiles media folders, and the registry routes describing
    the post types, taxonomies and publication statuses themselves. The types registry is the record that
