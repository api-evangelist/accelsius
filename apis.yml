aid: accelsius
name: Accelsius
description: 'Accelsius LLC is an Austin, Texas thermal-management company founded in 2022 by Innventure
  to commercialize two-phase, direct-to-chip liquid cooling for AI, HPC and mission-critical data centers.
  Its NeuCool platform circulates a non-conductive dielectric refrigerant through cold plates mounted
  directly on CPUs and GPUs, removing heat by evaporation rather than by bringing water into the IT rack,
  and supports 4,500W+ per socket and rack densities up to 250kW. The product line includes the IR150
  in-rack CDU, the MR250 medium-rack CDU, the NeuCool Thermal Simulation Rack and Liquid Simulation System
  used for evaluation and deployment planning, and multi-GPU cold plate assemblies, backed by professional
  services spanning system architecture, integration, deployment and maintenance. Accelsius is a hardware
  manufacturer, not a software or data company: it publishes no developer program, product API, SDK or
  machine-readable product specification. The only machine-readable interface on its public surface is
  the WordPress core REST API behind accelsius.com, which serves the company''s own blog, news, white-paper,
  case-study, podcast and video content anonymously and read-only.'
