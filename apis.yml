  name: Accelsius Media API
  description: Public read access to the 903-item accelsius.com media library - NeuCool product renders
    and photography, thermal diagrams, partner and customer logos, and the PDF white papers, studies and
    infographics linked from https://accelsius.com/papers-studies/. Each attachment carries source_url
    for the original file and media_details.sizes for the generated variants, and is organised by the
    HappyFiles folder taxonomy. Filter with mime_type=application/pdf to reach the document set. Anonymous
    and read-only.
