openapi: 3.1.0
info:
  title: Accelsius Taxonomy API
  version: wp/v2
  summary: Public read surface of the taxonomies, terms, post types and statuses registered on accelsius.com.
  description: 'The classification layer behind the content API: the eight `category` terms Accelsius
    uses to separate content classes (blog, white-paper, press-release, news-article, video, podcast,
    infographic, case-study), the five `post_tag` topic terms (2pd2c-education, neucool-products, accelsius-news,
    scientific-research, featured), the 19 HappyFiles media folders, and the registry endpoints that describe
    the post types, taxonomies and publication statuses themselves.


    Accelsius publishes accelsius.com on WordPress (WP Engine origin, Cloudflare edge, MalCare firewall)
    with the WordPress core REST API enabled and anonymously readable. This is NOT a product API that
    Accelsius offers to customers — Accelsius manufactures two-phase direct-to-chip liquid-cooling hardware
    and ships no developer program, SDK or product API. It is the content API behind the company marketing
    site, captured for discovery purposes. Anonymous access is read-only: the `Allow` response header
    on every collection is `GET`, and write operations require WordPress cookie authentication with an
    X-WP-Nonce header or an Application Password, returning HTTP 401 to anonymous callers.'
  contact:
    name: Accelsius
    url: https://accelsius.com/contact/
    email: info@accelsius.com
  license:
    name: Site content - all rights reserved
    url: https://accelsius.com/privacy-policy/
  x-apis-io-provenance:
    method: derived
    source: https://accelsius.com/wp-json/
    derived_on: '2026-08-06'
    note: Parameters are transcribed verbatim from the `args` the site publishes for each route in its
      live WordPress route-discovery document at https://accelsius.com/wp-json/ (387 routes across 16
      namespaces). Response schemas are derived from the field names and JSON types observed in live anonymous
      GET responses on 2026-08-06. Every collection operation documented here was probed anonymously and
      returned HTTP 200; routes that returned 401 without credentials (settings, menus, menu-items, templates,
      template-parts, themes, plugins, widgets, block-types, users/me) are deliberately omitted. No operation,
      parameter or field was invented, and no live response value is reproduced here as an example.
  x-provider-published: false
servers:
- url: https://accelsius.com/wp-json
  description: Production
tags:
- name: Categories
  description: Content-class terms in the category taxonomy.
- name: Tags
  description: Topic terms in the post_tag taxonomy.
- name: Media Folders
  description: HappyFiles folders organising the media library.
- name: Registry
  description: Post types, taxonomies and publication statuses registered on the site.
paths:
  /wp/v2/categories:
    get:
      tags:
      - Categories
      operationId: listCategories
      summary: List categories
      description: Returns the terms in the `category` taxonomy. Eight terms were observed, each carrying
        a `count` of the published items assigned to it.
      security: []
      responses:
        '200':
          description: A page of results.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
            Link:
              $ref: '#/components/headers/LinkPagination'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '400':
          description: Invalid parameter (rest_invalid_param), e.g. per_page outside 1-100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: page
        in: query
        description: Current page of the collection.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Maximum number of items to be returned in result set.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: search
        in: query
        description: Limit results to those matching a string.
        schema:
          type: string
      - name: exclude
        in: query
        description: Ensure result set excludes specific IDs.
        schema:
          type: array
          items:
            type: integer
      - name: include
        in: query
        description: Limit result set to specific IDs.
        schema:
          type: array
          items:
            type: integer
      - name: order
        in: query
        description: Order sort attribute ascending or descending.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: orderby
        in: query
        description: Sort collection by term attribute.
        schema:
          type: string
          enum:
          - id
          - include
          - name
          - slug
          - include_slugs
          - term_group
          - description
          - count
          default: name
      - name: hide_empty
        in: query
        description: Whether to hide terms not assigned to any posts.
        schema:
          type: boolean
          default: false
      - name: parent
        in: query
        description: Limit result set to terms assigned to a specific parent.
        schema:
          type: integer
      - name: post
        in: query
        description: Limit result set to terms assigned to a specific post.
        schema:
          type: integer
          default: null
      - name: slug
        in: query
        description: Limit result set to terms with one or more specific slugs.
        schema:
          type: array
          items:
            type: string
      x-observed-total: 8
