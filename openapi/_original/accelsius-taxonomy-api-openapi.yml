components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords over HTTP Basic. Advertised by the site at https://accelsius.com/wp-json/
        under `authentication.application-passwords`. Every operation documented in this file is anonymous
        and takes no credential; this scheme is declared because it is the only credential the host accepts,
        and it governs the write and edit-context operations that are deliberately NOT documented here.
  schemas:
    WPError:
      type: object
      title: WPError
      description: The WordPress REST error envelope. It is NOT RFC 9457 problem+json — the media type
        is application/json and the shape is a flat object carrying a machine-readable `code` slug, a
        human `message`, and a `data` object repeating the HTTP status.
      properties:
        code:
          type: string
          description: Machine-readable error slug, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status repeated in the body.
      required:
      - code
      - message
    Term:
      type: object
      title: Term
      description: A taxonomy term (category, post tag, or HappyFiles media folder).
      properties:
        id:
          type: integer
          description: Unique numeric identifier for the term.
        count:
          type: integer
          description: Number of published objects assigned to the term.
        description:
          type: string
          description: HTML description of the term.
        link:
          type: string
          format: uri
          description: URL of the term archive on accelsius.com.
        name:
          type: string
          description: HTML title for the term.
        slug:
          type: string
          description: Alphanumeric identifier for the term, unique within its taxonomy.
        taxonomy:
          type: string
          description: Taxonomy the term belongs to.
          enum:
          - category
          - post_tag
          - happyfiles_category
        parent:
          type: integer
          description: ID of the parent term, or 0 when there is none. Categories and HappyFiles folders
            are hierarchical; post tags are not.
        meta:
          type: array
          items: {}
          description: Registered meta fields exposed for the term.
        acf:
          type: array
          items: {}
          description: Advanced Custom Fields values registered on the term.
        yoast_head:
          type: string
          description: Yoast SEO head markup for the term archive.
        yoast_head_json:
          type: object
          description: Yoast SEO head metadata for the term archive.
        _links:
          type: object
          description: HAL-style link relations (self, collection, about, wp:post_type).
      required:
      - id
      - slug
      - name
      - taxonomy
      x-schema-provenance: Partially verified. Live anonymous GETs of /wp/v2/categories (HTTP 200, 8 terms),
        /wp/v2/tags (HTTP 200, 5 terms) and /wp/v2/happyfiles_category (HTTP 200, 19 terms) on 2026-08-06
        confirmed the routes are public and returned the id, slug and count members read from those responses.
        Every subsequent re-probe of the term routes was refused by the site MalCare firewall with HTTP
        403, so a complete term body was never captured; the remaining members listed here are the WordPress
        core term fields plus the acf/yoast_head/yoast_head_json extensions this site demonstrably adds
        to its post objects, and they are recorded as expected rather than observed. Treat id, slug, count,
        name and taxonomy as verified and the rest as unconfirmed.
    PostType:
      type: object
      title: PostType
      description: A post type registered on accelsius.com.
      properties:
        description:
          type: string
          description: Description of the object, rendered to HTML.
        hierarchical:
          type: boolean
          description: Whether the type or taxonomy supports parent/child relations.
        has_archive:
          type: boolean
        name:
          type: string
          description: Human-readable name of the object.
        slug:
          type: string
          description: Alphanumeric identifier for the object, unique within its type.
        icon:
          type: string
        taxonomies:
          type: array
          items:
            type: string
          description: Taxonomies registered against the post type.
        rest_base:
          type: string
          description: The REST route segment the type is served under.
        rest_namespace:
          type: string
          description: The REST namespace the type is served under.
        template:
          type: array
          items: {}
          description: Theme file used to display the object.
        template_lock:
          type: boolean
        yoast_head:
          type: string
          description: Yoast SEO head markup for the object, as an HTML string.
        yoast_head_json:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            robots:
              type: object
              properties:
                index:
                  type: string
                follow:
                  type: string
                max-snippet:
                  type: string
                max-image-preview:
                  type: string
                max-video-preview:
                  type: string
            canonical:
              type: string
              format: uri
            og_locale:
              type: string
            og_type:
              type: string
            og_title:
              type: string
            og_description:
              type: string
            og_url:
              type: string
              format: uri
            og_site_name:
              type: string
            twitter_card:
              type: string
            schema:
              type: object
              properties:
                '@context':
                  type: string
                  format: uri
                '@graph':
                  type: array
                  items:
                    type: object
                    properties:
                      '@type': {}
                      '@id': {}
                      url: {}
                      name: {}
                      isPartOf: {}
                      datePublished: {}
                      dateModified: {}
                      description: {}
                      breadcrumb: {}
                      inLanguage: {}
          description: Yoast SEO head metadata for the object, as structured JSON.
        _links:
          type: object
          properties:
            collection:
              type: array
              items:
                type: object
                properties:
                  href:
                    type: string
                    format: uri
            wp:items:
              type: array
              items:
                type: object
                properties:
                  href:
                    type: string
                    format: uri
            curies:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  href:
                    type: string
                    format: uri
                  templated:
                    type: boolean
          description: HAL-style link relations (self, collection, author, wp:term, wp:featuredmedia).
