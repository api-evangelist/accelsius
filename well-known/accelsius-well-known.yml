notes: >-
  accelsius.com publishes no /.well-known/ discovery documents of any kind, and no A2A agent card
  at either the canonical or the legacy path. False-positive hazard on this host: the WordPress
  404 handler returns an HTML page for unknown /.well-known/* paths, so a probe that only checks
  for a non-empty body would mis-read every one of these as a hit. Each status above is the
  observed HTTP status code and every 404 body was HTML, not JSON. Note also that this host runs
  the MalCare WordPress firewall, which began returning HTTP 403 ("Blocked because of Malicious
  Activities") to this pass after a short burst of item-level requests; collection-level reads
  continued to succeed. Probing was slowed to the robots.txt Crawl-delay and item-level
  enumeration was abandoned rather than evaded.
